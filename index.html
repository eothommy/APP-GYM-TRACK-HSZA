<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAZSA">
<meta name="theme-color" content="#F5F2EE">
<title>HAZSA — Diário de Treino</title>
<style>
  :root{
    --bg: #F5F2EE;
    --surface: #FFFFFF;
    --surface-2: #EFEAE4;
    --surface-3: #E3DCD3;
    --border: #DED6CC;
    --text: #1C1917;
    --text-dim: #6E6862;
    --text-faint: #9C948B;
    --accent: #C41E3A;
    --accent-strong: #8F1329;
    --accent-dim: rgba(196,30,58,.32);
    --accent-wash: rgba(196,30,58,.09);
    --on-accent: #FFF9F7;
    --decrease: #6E6862;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overscroll-behavior-y: none;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    display:flex;
    justify-content:center;
  }
  .display{
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Roboto Condensed", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  #app{
    width:100%;
    max-width: 480px;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background: var(--bg);
  }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- header ---------- */
  header{
    padding: calc(18px + var(--safe-top)) 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header .brand{
    font-size: 22px;
    letter-spacing: 0.04em;
  }
  header .brand em{
    font-style: normal;
    color: var(--accent);
  }
  header .clock{
    font-size: 13px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding: 16px 16px calc(90px + var(--safe-bottom));
  }

  /* ---------- generic ---------- */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(28,25,23,.04);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor:pointer;
    width:100%;
    font-family:inherit;
  }
  .btn-primary{ background: var(--accent); color: var(--on-accent); }
  .btn-primary:active{ background: var(--accent-strong); }
  .btn-ghost{ background: var(--surface); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:active{ background: var(--surface-2); }
  .btn-danger{ background: transparent; color: var(--accent); border:1px solid var(--accent-dim); }
  .btn-danger:active{ background: var(--accent-wash); }
  .btn-small{ width:auto; padding:9px 14px; font-size:13px; border-radius:10px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  input, select{
    width:100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus{ outline:none; border-color: var(--accent); background: var(--surface); }
  label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:5px; }
  h2{ font-size:13px; text-transform: none; color: var(--text-dim); margin: 4px 0 12px; font-weight:600; letter-spacing:.02em;}
  .empty{
    text-align:center;
    padding: 50px 20px;
    color: var(--text-faint);
  }
  .empty .big{ font-size:42px; margin-bottom:10px; }
  .pill{
    display:inline-block;
    font-size:11px;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .pr-pill{ background: var(--accent-wash); color: var(--accent); border-color: var(--accent-dim); font-weight:700; }

  /* ---------- tab bar ---------- */
  nav#tabbar{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 6px calc(8px + var(--safe-bottom));
  }
  nav#tabbar button{
    position:relative;
    flex:1;
    background:none;
    border:none;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding: 6px 2px;
    cursor:pointer;
  }
  nav#tabbar button .ic{ font-size:19px; }
  nav#tabbar button.active{ color: var(--accent); font-weight:700; }
  nav#tabbar button.active::before{
    content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:18px; height:3px; background:var(--accent); border-radius:0 0 3px 3px;
  }

  /* ---------- home ---------- */
  .cta-start{
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    padding: 26px 20px;
    text-align:center;
    margin-bottom: 16px;
  }
  .cta-start .kicker{ color:var(--text-dim); font-size:13px; margin-bottom:14px;}
  .stat-row{ display:flex; gap:10px; margin-bottom:14px; }
  .stat-box{
    flex:1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align:center;
  }
  .stat-box .num{ font-size: 26px; color: var(--text); }
  .stat-box .lbl{ font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* ---------- active workout ---------- */
  .timer-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--surface);
    border:1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .timer-bar .live{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--accent); font-weight:700; }
  .timer-bar .dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.35; transform:scale(.75); }
  }
  .timer-bar .t{ font-size: 30px; font-variant-numeric: tabular-nums; }
  .ex-block{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .ex-block .ex-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .ex-block .ex-title .name{ font-size:16px; font-weight:700;}
  .ex-block .prev-hint{ font-size:12px; color: var(--text-faint); margin-bottom:10px;}
  .set-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .set-row .idx{
    width:22px; color:var(--text-faint); font-size:13px; text-align:center; flex-shrink:0;
  }
  .set-row input{ text-align:center; padding: 9px 6px;}
  .set-row .x{ color:var(--text-faint); flex:0 0 auto; }
  .set-row .rm{ flex:0 0 auto; background:none; border:none; color:var(--text-faint); font-size:18px; padding:4px 6px; cursor:pointer;}
  .add-set{ background:none; border:1px dashed var(--border); color:var(--text-dim); border-radius:10px; padding:8px; width:100%; font-size:13px; cursor:pointer; margin-top:2px;}

  /* ---------- history ---------- */
  .hist-card{ cursor:pointer; }
  .hist-card .top{ display:flex; justify-content:space-between; align-items:baseline;}
  .hist-card .date{ font-size:15px; font-weight:700;}
  .hist-card .dur{ font-size:13px; color:var(--text-dim);}
  .hist-card .tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- progress ---------- */
  .chart-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .pr-badge{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--accent-wash);
    border: 1px solid var(--accent-dim);
    color: var(--accent-strong);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 10px;
  }

  /* ---------- modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(28,25,23,.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-bg.hidden{ display:none; }
  .modal{
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    width:100%; max-width:480px;
    max-height: 85vh;
    overflow-y:auto;
    padding: 18px 18px calc(24px + var(--safe-bottom));
    border-top: 1px solid var(--border);
  }
  .modal-handle{ width:36px; height:4px; background:var(--border); border-radius:4px; margin: 0 auto 14px; }
  .modal h3{ margin:0 0 14px; font-size:18px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    background: var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 13px; border-radius: 20px; font-size:13px; cursor:pointer;
  }
  .chip.selected{ background: var(--accent-wash); border-color:var(--accent-dim); color:var(--accent-strong); font-weight:700; }
  .close-x{ position:absolute; top:14px; right:14px; background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; }
  .field{ margin-bottom: 12px; }
  .toast{
    position:fixed; bottom: calc(80px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
    background: var(--text); color: var(--bg); padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:700; z-index:60; opacity:0; transition:opacity .25s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand display">HA<em>ZSA</em></div>
    <div class="clock" id="headerClock"></div>
  </header>
  <main id="main"></main>
  <nav id="tabbar">
    <button data-tab="home"><span class="ic">🏠</span>Treino</button>
    <button data-tab="history"><span class="ic">📖</span>Histórico</button>
    <button data-tab="progress"><span class="ic">📈</span>Progresso</button>
    <button data-tab="exercises"><span class="ic">🗂️</span>Exercícios</button>
  </nav>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA LAYER ============ */
const STORAGE_KEY = 'ferro_gymtrack_v1';

const DEFAULT_EXERCISES = [
  {id:'e1', name:'Supino reto', cat:'Peito'},
  {id:'e2', name:'Supino inclinado', cat:'Peito'},
  {id:'e3', name:'Crucifixo', cat:'Peito'},
  {id:'e4', name:'Puxada frente', cat:'Costas'},
  {id:'e5', name:'Remada curvada', cat:'Costas'},
  {id:'e6', name:'Levantamento terra', cat:'Costas'},
  {id:'e7', name:'Agachamento livre', cat:'Pernas'},
  {id:'e8', name:'Leg press', cat:'Pernas'},
  {id:'e9', name:'Cadeira extensora', cat:'Pernas'},
  {id:'e10', name:'Desenvolvimento', cat:'Ombro'},
  {id:'e11', name:'Elevação lateral', cat:'Ombro'},
  {id:'e12', name:'Rosca direta', cat:'Braço'},
  {id:'e13', name:'Tríceps corda', cat:'Braço'},
  {id:'e14', name:'Abdominal', cat:'Core'},
];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      d.exercises = d.exercises || DEFAULT_EXERCISES.slice();
      d.workouts = d.workouts || [];
      d.cycles = d.cycles || [];
      d.routines = d.routines || [];
      if(d.active===undefined) d.active = null;
      return d;
    }
  }catch(e){ console.error('load error', e); }
  return { exercises: DEFAULT_EXERCISES.slice(), workouts: [], active: null, cycles: [], routines: [] };
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); return true; }
  catch(e){
    console.error('save error', e);
    toast('Não coube no armazenamento do navegador — tente um arquivo menor');
    return false;
  }
}
let DATA = loadData();

// primeira abertura: pré-cadastra o ciclo com os treinos A/B/C enviados
if(DATA.cycles.length===0 && DATA.routines.length===0 && DATA.workouts.length===0){
  const cycleId = uid();
  DATA.cycles.push({ id: cycleId, name: 'Ciclo 1', createdAt: Date.now(), active: true });
  DATA.routines.push(
    { id: uid(), cycleId, order:0, name:'Treino A — Fullbody', exercises:[
      {name:'Abdominal twist', sets:3, reps:'12', rest:'1 min'},
      {name:'Abdominal infra', sets:3, reps:'10-15', rest:'1 min'},
      {name:'Prancha', sets:3, reps:'40-60s', rest:'1 min'},
      {name:'Panturrilha sentado + em pé', sets:3, reps:'12 + 12', rest:'1 min'},
      {name:'Levantamento terra', sets:3, reps:'6-8', rest:'2-3 min'},
      {name:'Flexão pélvica', sets:3, reps:'8-12', rest:'1min30'},
      {name:'Cadeira abdutora', sets:3, reps:'12-15', rest:'1 min'},
      {name:'Mesa flexora', sets:3, reps:'10-15', rest:'1-1min30'},
      {name:'Remada triângulo', sets:4, reps:'8-12', rest:'1min30'},
      {name:'Supino halter inclinado', sets:4, reps:'8-12', rest:'1min30'},
      {name:'Elevação lateral', sets:4, reps:'12-15', rest:'1 min'}
    ]},
    { id: uid(), cycleId, order:1, name:'Treino B — Fullbody', exercises:[
      {name:'Prancha lateral', sets:3, reps:'40s/lado', rest:'1 min'},
      {name:'Agachamento livre', sets:3, reps:'6-8', rest:'2-3 min'},
      {name:'Cadeira extensora', sets:3, reps:'10-12', rest:'1min30'},
      {name:'Agachamento búlgaro', sets:3, reps:'8-10/perna', rest:'1min30-2min'},
      {name:'Cadeira adutora', sets:3, reps:'12-15', rest:'1 min'},
      {name:'Puxada frente supinada', sets:4, reps:'8-12', rest:'1min30'},
      {name:'Crucifixo máquina', sets:3, reps:'10-15', rest:'1min30'},
      {name:'Desenvolvimento halter', sets:4, reps:'8-12', rest:'1min30'}
    ]},
    { id: uid(), cycleId, order:2, name:'Treino C — Superiores', exercises:[
      {name:'Supino reto halter', sets:4, reps:'6-10', rest:'2 min'},
      {name:'Remada máquina pegada neutra', sets:4, reps:'8-12', rest:'1min30'},
      {name:'Puxada triângulo', sets:3, reps:'8-12', rest:'1min30'},
      {name:'Crucifixo inverso máquina', sets:3, reps:'12-15', rest:'1 min'},
      {name:'Elevação lateral', sets:4, reps:'12-15', rest:'1 min'},
      {name:'Rosca bíceps', sets:3, reps:'8-12', rest:'1min30'},
      {name:'Tríceps testa polia alta', sets:3, reps:'8-12', rest:'1min30'}
    ]}
  );
  saveData();
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- cycles & routines ---- */
function activeCycle(){ return DATA.cycles.find(c=>c.active) || null; }
function routinesForCycle(cycleId){ return DATA.routines.filter(r=>r.cycleId===cycleId).sort((a,b)=>a.order-b.order); }
function routineExecCount(routineId){ return DATA.workouts.filter(w=>w.routineId===routineId).length; }
function findOrCreateExerciseId(name){
  const trimmed = (name||'').trim();
  let ex = DATA.exercises.find(e=> e.name.toLowerCase() === trimmed.toLowerCase());
  if(!ex){
    ex = { id: uid(), name: trimmed, cat: 'Outro' };
    DATA.exercises.push(ex);
  }
  return ex.id;
}

/* ============ HELPERS ============ */
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return `${h}h${String(m).padStart(2,'0')}`;
  return `${m}min ${String(s).padStart(2,'0')}s`;
}
function fmtDurShort(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function exName(id){ const e = DATA.exercises.find(x=>x.id===id); return e ? e.name : '—'; }
function exObj(id){ return DATA.exercises.find(x=>x.id===id) || null; }
function isImageSrc(url){ return /^data:image\//i.test(url||'') || /\.(png|jpe?g|gif|webp|avif)(\?.*)?$/i.test(url||''); }
function isVideoSrc(url){ return /^data:video\//i.test(url||'') || /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url||''); }
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = ()=> reject(r.error);
    r.readAsDataURL(file);
  });
}
function mediaPreviewHtml(m, size){
  size = size || 44;
  if(!m) return '';
  if(isVideoSrc(m)){
    return `<video src="${escapeHtml(m)}" muted playsinline preload="metadata" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;flex-shrink:0;background:#000;" onclick="this.controls=true;this.play();event.stopPropagation();"></video>`;
  }
  if(isImageSrc(m)){
    return `<a href="${escapeHtml(m)}" target="_blank" rel="noopener" style="flex-shrink:0;"><img src="${escapeHtml(m)}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;"></a>`;
  }
  return `<a href="${escapeHtml(m)}" target="_blank" rel="noopener" style="flex-shrink:0;width:${size}px;height:${size}px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.45)}px;text-decoration:none;">▶</a>`;
}
function mediaThumb(ex, size){
  return (ex && ex.media) ? mediaPreviewHtml(ex.media, size) : '';
}
function mediaFieldHtml(prefix, currentMedia){
  const hasCurrent = !!currentMedia;
  const isData = /^data:/i.test(currentMedia||'');
  return `
    ${hasCurrent ? `
    <div class="field">
      <label>Mídia atual</label>
      <div style="display:flex;align-items:center;gap:10px;">
        ${mediaPreviewHtml(currentMedia, 56)}
        <button type="button" id="${prefix}RemoveBtn" class="btn btn-ghost btn-small" style="width:auto;">Remover</button>
      </div>
    </div>` : ''}
    <div class="field">
      <label>Enviar arquivo do celular (imagem ou vídeo curto)</label>
      <input type="file" id="${prefix}File" accept="image/*,video/mp4,video/webm,video/quicktime">
    </div>
    <div class="field">
      <label>Ou cole um link (opcional)</label>
      <input type="url" id="${prefix}Url" placeholder="https://..." value="${(hasCurrent && !isData) ? escapeHtml(currentMedia) : ''}">
    </div>
    <p style="font-size:11px;color:var(--text-faint);margin-bottom:14px;">Arquivos enviados ficam guardados dentro do app e funcionam sem internet depois. Prefira vídeos curtos — o espaço de armazenamento do navegador é limitado (poucos MB no total).</p>
  `;
}
function createMediaFieldController(prefix, currentMedia){
  let removed = false;
  const removeBtn = document.getElementById(prefix+'RemoveBtn');
  if(removeBtn){
    removeBtn.addEventListener('click', ()=>{
      removed = true;
      const wrap = removeBtn.closest('.field');
      if(wrap) wrap.remove();
    });
  }
  return async function resolveMedia(){
    const fileInput = document.getElementById(prefix+'File');
    const file = fileInput && fileInput.files && fileInput.files[0];
    if(file){
      try{ return await readFileAsDataUrl(file); }
      catch(err){ toast('Não consegui ler o arquivo'); return currentMedia; }
    }
    const urlField = document.getElementById(prefix+'Url');
    const urlVal = urlField ? urlField.value.trim() : '';
    if(urlVal) return urlVal;
    if(removed) return null;
    return currentMedia;
  };
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

// volume of an exercise entry in a workout (sum weight*reps)
function entryVolume(entry){
  return entry.sets.reduce((s,st)=> s + (Number(st.weight)||0) * (Number(st.reps)||0), 0);
}
// best (max weight) set of an entry
function entryMaxWeight(entry){
  return entry.sets.reduce((m,st)=> Math.max(m, Number(st.weight)||0), 0);
}
// get last completed workout containing exerciseId, excluding current active workout id if given
function lastEntryFor(exerciseId, excludeWorkoutId){
  const done = DATA.workouts
    .filter(w => w.id !== excludeWorkoutId)
    .sort((a,b)=> new Date(b.date) - new Date(a.date));
  for(const w of done){
    const entry = w.entries.find(e=>e.exerciseId===exerciseId);
    if(entry && entry.sets.length) return {workout:w, entry};
  }
  return null;
}
// all-time max weight for exercise across finished workouts
function allTimeMax(exerciseId, excludeWorkoutId){
  let max = 0;
  DATA.workouts.filter(w=>w.id!==excludeWorkoutId).forEach(w=>{
    const entry = w.entries.find(e=>e.exerciseId===exerciseId);
    if(entry) max = Math.max(max, entryMaxWeight(entry));
  });
  return max;
}

function renderExBlock(entry, ei){
  const ex = exObj(entry.exerciseId);
  const prev = lastEntryFor(entry.exerciseId, DATA.active.id);
  const max = allTimeMax(entry.exerciseId, DATA.active.id);

  let metaLine = '';
  if(entry.target && (entry.target.reps || entry.target.rest)){
    metaLine = `Meta: ${entry.sets.length}×${entry.target.reps || '—'}${entry.target.rest ? ' · Descanso ' + entry.target.rest : ''}`;
  }

  let loadLine = '';
  if(prev || max>0){
    const parts = [];
    if(max>0) parts.push(`<strong style="color:var(--accent-strong);">Recorde: ${max}kg</strong>`);
    if(prev){
      const sets = prev.entry.sets.map(s=>`${s.weight}kg×${s.reps}`).join(', ');
      parts.push(`Último (${fmtDate(prev.workout.date)}): ${sets}`);
    }
    loadLine = parts.join(' · ');
  } else if(!entry.target){
    loadLine = 'Primeira vez registrando este exercício — não regrida da próxima vez!';
  }

  return `
    <div class="ex-block">
      <div class="ex-title">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          ${ex && ex.media ? mediaThumb(ex, 38) : `<button data-add-media="${entry.exerciseId}" title="Adicionar vídeo/imagem de referência" style="flex-shrink:0;width:38px;height:38px;border-radius:8px;border:1px dashed var(--border);background:none;color:var(--text-faint);font-size:16px;cursor:pointer;">🎬</button>`}
          <div class="name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${exName(entry.exerciseId)}</div>
        </div>
        <button class="rm" data-action="removeExercise" data-ei="${ei}" style="background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;flex-shrink:0;">✕</button>
      </div>
      ${metaLine ? `<div class="prev-hint">${metaLine}</div>` : ''}
      ${loadLine ? `<div class="prev-hint" style="margin-top:${metaLine?'-6px':'0'};">${loadLine}</div>` : ''}
      <div style="height:10px;"></div>
      ${entry.sets.map((st, si)=>{
        const isPR = max>0 && Number(st.weight) > max;
        return `
        <div class="set-row">
          <div class="idx">${si+1}</div>
          <input type="number" inputmode="decimal" placeholder="kg" value="${st.weight}" data-action="setWeight" data-ei="${ei}" data-si="${si}">
          <div class="x">×</div>
          <input type="number" inputmode="numeric" placeholder="reps" value="${st.reps}" data-action="setReps" data-ei="${ei}" data-si="${si}">
          ${isPR ? '<span class="pill pr-pill">PR</span>' : ''}
          <button class="rm" data-action="removeSet" data-ei="${ei}" data-si="${si}">✕</button>
        </div>`;
      }).join('')}
      <button class="add-set" data-action="addSet" data-ei="${ei}">+ Adicionar série</button>
    </div>
  `;
}

function handleAction(e){
  const action = e.currentTarget.dataset.action;
  const ei = Number(e.currentTarget.dataset.ei);
  const si = e.currentTarget.dataset.si !== undefined ? Number(e.currentTarget.dataset.si) : null;
  const a = DATA.active;
  if(!a) return;

  if(action==='addSet'){
    a.entries[ei].sets.push({weight:'', reps:''});
    saveData(); render();
  } else if(action==='removeSet'){
    a.entries[ei].sets.splice(si,1);
    saveData(); render();
  } else if(action==='removeExercise'){
    a.entries.splice(ei,1);
    saveData(); render();
  } else if(action==='setWeight'){
    a.entries[ei].sets[si].weight = e.currentTarget.value;
    saveData();
  } else if(action==='setReps'){
    a.entries[ei].sets[si].reps = e.currentTarget.value;
    saveData();
  }
}

function startWorkout(){
  DATA.active = { id: uid(), startTime: Date.now(), entries: [] };
  saveData(); render();
}

function finishWorkout(){
  const a = DATA.active;
  const validEntries = a.entries
    .map(e=>({...e, sets: e.sets.filter(s=> s.weight!=='' && s.reps!=='')}))
    .filter(e=>e.sets.length>0);

  if(validEntries.length===0){
    openConfirm('Finalizar sem exercícios?', 'Nenhuma série válida foi registrada. Finalizar mesmo assim vai descartar o treino.', ()=>{
      DATA.active = null; saveData(); closeModal(); render();
    });
    return;
  }

  const durationSec = (Date.now() - a.startTime)/1000;
  const workout = {
    id: a.id,
    date: new Date().toISOString(),
    durationSec,
    entries: validEntries,
    routineId: a.routineId || null,
    routineName: a.routineName || null,
    cycleId: a.cycleId || null
  };

  // detect PRs for toast
  let prCount = 0;
  validEntries.forEach(entry=>{
    const max = allTimeMax(entry.exerciseId, workout.id);
    if(entryMaxWeight(entry) > max) prCount++;
  });

  DATA.workouts.push(workout);
  DATA.active = null;
  saveData();
  render();
  toast(prCount>0 ? `Treino salvo · ${prCount} recorde${prCount>1?'s':''} novo${prCount>1?'s':''}! 🔥` : 'Treino salvo');
}

function startWorkoutFromRoutine(routineId){
  const routine = DATA.routines.find(r=>r.id===routineId);
  if(!routine) return;
  const entries = routine.exercises.map(ex=>{
    const exerciseId = findOrCreateExerciseId(ex.name);
    return {
      exerciseId,
      sets: Array.from({length: Math.max(1, Number(ex.sets)||1)}, ()=>({weight:'', reps:''})),
      target: { reps: ex.reps || '', rest: ex.rest || '' }
    };
  });
  DATA.active = { id: uid(), startTime: Date.now(), entries, routineId: routine.id, routineName: routine.name, cycleId: routine.cycleId };
  saveData(); render();
}

/* ============ ROUTINE FORM (modal) ============ */
function openRoutineModal(cycleId, routineId){
  const editing = routineId ? DATA.routines.find(r=>r.id===routineId) : null;
  let rows = editing ? editing.exercises.map(e=>({...e})) : [{name:'', sets:3, reps:'', rest:''}];

  function renderForm(){
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-handle"></div>
      <h3>${editing ? 'Editar rotina' : 'Nova rotina'}</h3>
      <div class="field">
        <label>Nome da rotina</label>
        <input type="text" id="routineName" placeholder="Ex: Treino A — Fullbody" value="${editing ? escapeHtml(editing.name) : ''}">
      </div>
      <div id="routineRows"></div>
      <button class="btn btn-ghost" id="btnAddRow" style="margin:6px 0 16px;">+ Adicionar exercício</button>
      <button class="btn btn-primary" id="btnSaveRoutine">${editing ? 'Salvar alterações' : 'Criar rotina'}</button>
      <datalist id="exNameList">${DATA.exercises.map(e=>`<option value="${escapeHtml(e.name)}">`).join('')}</datalist>
    `;
    renderRows();
    document.getElementById('btnAddRow').addEventListener('click', ()=>{
      rows.push({name:'', sets:3, reps:'', rest:''});
      renderRows();
    });
    document.getElementById('btnSaveRoutine').addEventListener('click', saveRoutine);
  }

  function renderRows(){
    const wrap = document.getElementById('routineRows');
    wrap.innerHTML = rows.map((r,i)=>`
      <div class="card" style="padding:12px;margin-bottom:8px;">
        <div class="field" style="margin-bottom:8px;">
          <input type="text" placeholder="Nome do exercício" value="${escapeHtml(r.name)}" data-row="${i}" data-f="name" list="exNameList">
        </div>
        <div class="row" style="gap:6px;">
          <div><label>Séries</label><input type="number" inputmode="numeric" value="${r.sets}" data-row="${i}" data-f="sets"></div>
          <div><label>Reps</label><input type="text" placeholder="8-12" value="${escapeHtml(r.reps)}" data-row="${i}" data-f="reps"></div>
          <div><label>Descanso</label><input type="text" placeholder="1min30" value="${escapeHtml(r.rest)}" data-row="${i}" data-f="rest"></div>
        </div>
        <button data-remove="${i}" style="background:none;border:none;color:var(--text-faint);font-size:13px;cursor:pointer;margin-top:6px;padding:2px;">Remover</button>
      </div>
    `).join('');

    wrap.querySelectorAll('input[data-row]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const idx = Number(inp.dataset.row), f = inp.dataset.f;
        rows[idx][f] = f==='sets' ? Number(inp.value) : inp.value;
      });
    });
    wrap.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        rows.splice(Number(btn.dataset.remove),1);
        if(rows.length===0) rows.push({name:'', sets:3, reps:'', rest:''});
        renderRows();
      });
    });
  }

  function saveRoutine(){
    const name = document.getElementById('routineName').value.trim();
    const validRows = rows.filter(r=>r.name && r.name.trim());
    if(!name){ toast('Digite um nome pra rotina'); return; }
    if(validRows.length===0){ toast('Adicione ao menos um exercício'); return; }
    const cleanExercises = validRows.map(r=>({ name: r.name.trim(), sets: Number(r.sets)||1, reps: r.reps||'', rest: r.rest||'' }));
    if(editing){
      editing.name = name;
      editing.exercises = cleanExercises;
    } else {
      DATA.routines.push({ id: uid(), cycleId, name, exercises: cleanExercises, order: routinesForCycle(cycleId).length });
    }
    saveData(); closeModal(); render();
    toast(editing ? 'Rotina atualizada' : 'Rotina criada');
  }

  renderForm();
  openModal();
}

function openExercisePicker(){
  const cats = [...new Set(DATA.exercises.map(e=>e.cat))];
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <h3>Escolher exercício</h3>

    <div id="exList"></div>
    <button class="btn btn-ghost" id="btnCreateNew" style="margin-top:10px;">+ Criar novo exercício</button>
  `;
  function renderList(filter){
    const f = (filter||'').toLowerCase();
    const list = DATA.exercises.filter(e=> e.name.toLowerCase().includes(f));
    const byCat = {};
    list.forEach(e=>{ (byCat[e.cat] = byCat[e.cat]||[]).push(e); });
    document.getElementById('exList').innerHTML = Object.keys(byCat).map(cat=>`
      <div style="margin-bottom:12px;">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">${cat}</div>
        <div class="chip-row">
          ${byCat[cat].map(e=>`<div class="chip" data-id="${e.id}">${e.name}</div>`).join('')}
        </div>
      </div>
    `).join('') || `<div style="color:var(--text-faint);padding:20px 0;text-align:center;">Nada encontrado</div>`;
    document.querySelectorAll('#exList .chip').forEach(c=> c.addEventListener('click', ()=>{
      DATA.active.entries.push({ exerciseId: c.dataset.id, sets:[{weight:'',reps:''}] });
      saveData(); closeModal(); render();
    }));
  }
  renderList('');
  document.getElementById('exSearch').addEventListener('input', e=> renderList(e.target.value));
  document.getElementById('btnCreateNew').addEventListener('click', ()=> openNewExerciseModal(true));
  openModal();
}

function openAddMediaModal(exerciseId){
  const ex = exObj(exerciseId);
  if(!ex) return;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <h3>Referência — ${escapeHtml(ex.name)}</h3>
    ${mediaFieldHtml('media', ex.media)}
    <button class="btn btn-primary" id="btnSaveMedia">Salvar</button>
  `;
  const resolveMedia = createMediaFieldController('media', ex.media);
  document.getElementById('btnSaveMedia').addEventListener('click', async ()=>{
    const prevMedia = ex.media;
    ex.media = await resolveMedia();
    if(saveData()){
      closeModal(); render();
      toast(ex.media ? 'Referência salva' : 'Referência removida');
    } else {
      ex.media = prevMedia;
    }
  });
  openModal();
}

function openNewExerciseModal(thenAddToWorkout){
  const cats = ['Peito','Costas','Pernas','Ombro','Braço','Core','Cardio','Outro'];
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <h3>Novo exercício</h3>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="newExName" placeholder="Ex: Remada baixa">
    </div>
    <div class="field">
      <label>Categoria</label>
      <div class="chip-row" id="newExCats">
        ${cats.map((c,i)=>`<div class="chip ${i===0?'selected':''}" data-cat="${c}">${c}</div>`).join('')}
      </div>
    </div>
    ${mediaFieldHtml('newExMedia', null)}
    <button class="btn btn-primary" id="btnSaveNewEx">Salvar exercício</button>
  `;
  let selectedCat = cats[0];
  document.querySelectorAll('#newExCats .chip').forEach(c=> c.addEventListener('click', ()=>{
    document.querySelectorAll('#newExCats .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selectedCat = c.dataset.cat;
  }));
  const resolveMedia = createMediaFieldController('newExMedia', null);
  document.getElementById('btnSaveNewEx').addEventListener('click', async ()=>{
    const name = document.getElementById('newExName').value.trim();
    if(!name){ toast('Digite um nome'); return; }
    const media = await resolveMedia();
    const newEx = { id: uid(), name, cat: selectedCat, media };
    DATA.exercises.push(newEx);
    if(!saveData()){ DATA.exercises.pop(); return; }
    if(thenAddToWorkout && DATA.active){
      DATA.active.entries.push({ exerciseId: newEx.id, sets:[{weight:'',reps:''}] });
      saveData();
    }
    closeModal(); render();
    toast('Exercício criado');
  });
  openModal();
}

function openEditExerciseModal(exerciseId){
  const ex = exObj(exerciseId);
  if(!ex) return;
  const cats = ['Peito','Costas','Pernas','Ombro','Braço','Core','Cardio','Outro'];
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <h3>Editar exercício</h3>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="editExName" value="${escapeHtml(ex.name)}">
    </div>
    <div class="field">
      <label>Categoria</label>
      <div class="chip-row" id="editExCats">
        ${cats.map(c=>`<div class="chip ${c===ex.cat?'selected':''}" data-cat="${c}">${c}</div>`).join('')}
      </div>
    </div>
    ${mediaFieldHtml('editExMedia', ex.media)}
    <button class="btn btn-primary" id="btnSaveEditEx">Salvar alterações</button>
  `;
  let selectedCat = ex.cat;
  document.querySelectorAll('#editExCats .chip').forEach(c=> c.addEventListener('click', ()=>{
    document.querySelectorAll('#editExCats .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selectedCat = c.dataset.cat;
  }));
  const resolveMedia = createMediaFieldController('editExMedia', ex.media);
  document.getElementById('btnSaveEditEx').addEventListener('click', async ()=>{
    const name = document.getElementById('editExName').value.trim();
    if(!name){ toast('Digite um nome'); return; }
    const prevName = ex.name, prevCat = ex.cat, prevMedia = ex.media;
    ex.name = name;
    ex.cat = selectedCat;
    ex.media = await resolveMedia();
    if(saveData()){
      closeModal(); render();
      toast('Exercício atualizado');
    } else {
      ex.name = prevName; ex.cat = prevCat; ex.media = prevMedia;
    }
  });
  openModal();
}

/* ============ HISTORY ============ */
function renderHistory(){
  const list = DATA.workouts.slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(list.length===0){
    return `<div class="empty"><div class="big">📖</div>Seus treinos finalizados vão aparecer aqui.</div>`;
  }
  return list.map(w=>{
    const vol = w.entries.reduce((s,e)=> s+entryVolume(e), 0);
    return `
    <div class="card hist-card hist-open" data-id="${w.id}">
      <div class="top">
        <div class="date">${fmtDate(w.date)}${w.routineName ? ' · '+escapeHtml(w.routineName) : ''}</div>
        <div class="dur">${fmtDur(w.durationSec)}</div>
      </div>
      <div style="font-size:12px;color:var(--text-faint);margin-top:4px;">Volume total: ${Math.round(vol).toLocaleString('pt-BR')}kg</div>
      <div class="tags">
        ${w.entries.map(e=>`<span class="pill">${exName(e.exerciseId)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function openWorkoutDetail(id){
  const w = DATA.workouts.find(x=>x.id===id);
  if(!w) return;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <h3>${fmtDate(w.date)} · ${fmtDur(w.durationSec)}</h3>
    ${w.entries.map(entry=>`
      <div class="ex-block">
        <div class="ex-title"><div class="name">${exName(entry.exerciseId)}</div></div>
        ${entry.sets.map((s,i)=>`<div style="font-size:14px;color:var(--text-dim);padding:4px 0;">Série ${i+1}: <span style="color:var(--text);">${s.weight}kg × ${s.reps}</span></div>`).join('')}
      </div>
    `).join('')}
    <button class="btn btn-danger" id="btnDeleteWorkout" style="margin-top:8px;">Excluir treino</button>
  `;
  document.getElementById('btnDeleteWorkout').addEventListener('click', ()=>{
    openConfirm('Excluir este treino?', 'Essa ação não pode ser desfeita.', ()=>{
      DATA.workouts = DATA.workouts.filter(x=>x.id!==id);
      saveData(); closeModal(); render();
    });
  });
  openModal();
}

/* ============ PROGRESS ============ */
let currentProgressEx = null;

function renderProgress(){
  const usedIds = [...new Set(DATA.workouts.flatMap(w=>w.entries.map(e=>e.exerciseId)))];
  if(usedIds.length===0){
    return `<div class="empty"><div class="big">📈</div>Finalize alguns treinos para ver sua evolução de carga aqui.</div>`;
  }
  if(!currentProgressEx || !usedIds.includes(currentProgressEx)) currentProgressEx = usedIds[0];

  const points = DATA.workouts
    .filter(w=> w.entries.some(e=>e.exerciseId===currentProgressEx))
    .sort((a,b)=> new Date(a.date)-new Date(b.date))
    .map(w=>{
      const entry = w.entries.find(e=>e.exerciseId===currentProgressEx);
      return { date: w.date, max: entryMaxWeight(entry), vol: entryVolume(entry) };
    });

  const first = points[0].max, last = points[points.length-1].max;
  const change = last - first;
  const maxEver = Math.max(...points.map(p=>p.max));

  return `
    <select id="progressExSelect" style="margin-bottom:14px;">
      ${usedIds.map(id=>`<option value="${id}" ${id===currentProgressEx?'selected':''}>${exName(id)}</option>`).join('')}
    </select>
    <div class="stat-row">
      <div class="stat-box"><div class="num display">${maxEver}<span style="font-size:14px;">kg</span></div><div class="lbl">recorde</div></div>
      <div class="stat-box"><div class="num display" style="color:${change>=0?'var(--accent)':'var(--decrease)'}">${change>=0?'+':''}${change}<span style="font-size:14px;">kg</span></div><div class="lbl">desde o início</div></div>
      <div class="stat-box"><div class="num display">${points.length}</div><div class="lbl">registros</div></div>
    </div>
    <div class="chart-wrap">
      ${renderChart(points)}
    </div>
  `;
}

function renderChart(points){
  const w = 400, h = 180, pad = 28;
  const maxVal = Math.max(...points.map(p=>p.max)) * 1.1 || 1;
  const minVal = Math.min(...points.map(p=>p.max)) * 0.9;
  const range = (maxVal - minVal) || 1;
  const stepX = points.length>1 ? (w - pad*2) / (points.length-1) : 0;

  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((p.max - minVal)/range) * (h - pad*2);
    return {x,y,p};
  });

  const path = coords.map((c,i)=> (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${coords[coords.length-1].x.toFixed(1)},${h-pad} L${coords[0].x.toFixed(1)},${h-pad} Z`;

  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="#C41E3A" />`).join('');
  const labels = coords.filter((c,i)=> i===0 || i===coords.length-1 || coords.length<=4)
    .map(c=>`<text x="${c.x.toFixed(1)}" y="${h-6}" font-size="9" fill="#9C948B" text-anchor="middle">${new Date(c.p.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>`).join('');

  return `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="auto" style="display:block;">
      <path d="${areaPath}" fill="rgba(196,30,58,0.08)" stroke="none"/>
      <path d="${path}" fill="none" stroke="#C41E3A" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

/* ============ EXERCISES LIBRARY ============ */
function renderExercises(){
  const cats = [...new Set(DATA.exercises.map(e=>e.cat))];
  return `
    <button class="btn btn-primary" id="btnAddCustomExercise" style="margin-bottom:16px;">+ Novo exercício</button>
    ${cats.map(cat=>`
      <h2>${cat}</h2>
      ${DATA.exercises.filter(e=>e.cat===cat).map(e=>`
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px;">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;">
            ${e.media ? mediaThumb(e, 36) : `<div style="flex-shrink:0;width:36px;height:36px;border-radius:8px;border:1px dashed var(--border);"></div>`}
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(e.name)}</span>
          </div>
          <div style="display:flex;gap:2px;flex-shrink:0;">
            <button class="ex-lib-edit" data-id="${e.id}" style="background:none;border:none;color:var(--text-faint);font-size:15px;cursor:pointer;padding:4px 6px;">✎</button>
            <button class="ex-lib-del" data-id="${e.id}" style="background:none;border:none;color:var(--text-faint);font-size:15px;cursor:pointer;padding:4px 6px;">✕</button>
          </div>
        </div>
      `).join('')}
    `).join('')}
  `;
}

/* ============ MODAL / CONFIRM ============ */
function openModal(){ document.getElementById('modalBg').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modalBg').classList.add('hidden'); }
document.getElementById('modalBg').addEventListener('click', (e)=>{
  if(e.target.id==='modalBg') closeModal();
});

function openConfirm(title, body, onConfirm){
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <h3>${title}</h3>
    <p style="color:var(--text-dim);font-size:14px;margin-bottom:18px;">${body}</p>
    <div class="row">
      <button class="btn btn-ghost" id="btnCancelConfirm">Cancelar</button>
      <button class="btn btn-danger" id="btnDoConfirm" style="border-color:var(--accent);">Confirmar</button>
    </div>
  `;
  document.getElementById('btnCancelConfirm').addEventListener('click', closeModal);
  document.getElementById('btnDoConfirm').addEventListener('click', onConfirm);
  openModal();
}

/* ============ INIT ============ */
render();

// warn before closing tab if a workout is active
window.addEventListener('beforeunload', (e)=>{
  if(DATA.active){ e.preventDefault(); e.returnValue=''; }
});

// cache app for offline use once hosted (no-op on file:// or unsupported browsers)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
